services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: emulator
      POSTGRES_PASSWORD: emulator
      POSTGRES_DB: emulatordb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulator -d emulatordb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://emulator:emulator@postgres:5432/emulatordb
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      EMULATOR_BACKEND: avd
      UPLOADS_DIR: /app/uploads
      FIRMWARE_PACKAGES_DIR: /app/firmware
      INSTANCES_DIR: /tmp/emulator-instances
      IMAGES_DIR: /tmp/emulator-images
    volumes:
      - ../backend:/app
      - ../uploads:/app/uploads
      - ../firmware:/app/firmware
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
